name: Keep the online server awake

# Render's free web service spins down after 15 minutes without traffic and
# takes about a minute to boot again. A request every 10 minutes keeps it warm.
# Set the repository variable GAMBIT_SERVER_URL (Settings -> Variables ->
# Actions) to the deployed server, e.g. https://gambit-online.onrender.com.
# Without it this job does nothing.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.GAMBIT_SERVER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "GAMBIT_SERVER_URL is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 "$URL/health"
          echo " awake"
